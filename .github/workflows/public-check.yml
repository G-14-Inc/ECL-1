name: Public package checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: support-floor
            python: '3.10'
            node: '22'
            go: '1.26.10'
          - os: ubuntu-24.04
            profile: qualified
            python: '3.12'
            node: '24'
            go: '1.27.3'
          - os: windows-2025
            profile: qualified
            python: '3.12'
            node: '24'
            go: '1.27.3'
          - os: macos-15
            profile: qualified
            python: '3.12'
            node: '24'
            go: '1.27.3'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: python -m pip install ./packages/ecl-verify
      - run: python scripts/check_public.py
