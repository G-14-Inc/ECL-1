<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">ECL-1: authority before an action takes effect</title>
<desc id="desc">An AI system proposes an action to an external control layer. Policy and approvals inform a decision. The layer admits or denies the action and keeps signed evidence.</desc>
<rect width="1200" height="360" rx="8" fill="#f4f6f8"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#172b3d">
<text x="42" y="49" font-size="16" letter-spacing="2">ECL-1 / EXTERNAL CONTROL LAYER STANDARD</text>
<rect x="42" y="121" width="235" height="116" rx="5" fill="white" stroke="#637584" stroke-width="2" stroke-dasharray="6 5"/>
<text x="66" y="164" font-size="25" font-weight="bold">AI system</text><text x="66" y="194" font-size="20">proposes an action</text>
<path d="M282 179H373" stroke="#172b3d" stroke-width="3"/><path d="M373 179l-12-7v14z" fill="#172b3d"/>
<rect x="389" y="104" width="422" height="150" rx="4" fill="#172b3d"/>
<text x="417" y="145" font-size="18" fill="#a9dce3">POLICY · APPROVALS · CONTROL STATE</text>
<text x="417" y="184" font-size="27" font-weight="bold" fill="white">External control layer</text>
<text x="417" y="220" font-size="21" fill="white">Decide. Enforce. Record.</text>
<path d="M817 179H908" stroke="#172b3d" stroke-width="3"/><path d="M908 179l-12-7v14z" fill="#172b3d"/>
<text x="836" y="157" font-size="16">admitted</text>
<rect x="925" y="121" width="233" height="116" rx="5" fill="white" stroke="#637584" stroke-width="2"/>
<text x="949" y="164" font-size="25" font-weight="bold">Action released</text><text x="949" y="194" font-size="20">within its authority</text>
<text x="42" y="307" font-size="18">Robert F. Tilley Jr. · G-14, Inc.</text><text x="1158" y="307" text-anchor="end" font-size="18">externalcontrollayer.ai</text>
</g></svg>