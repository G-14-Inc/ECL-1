\* broken-actor-writes-decision: variant 'actor_writes_decision' on the
\* binding model. Binding, scope, audience, window, single use, evidence and
\* the one-way rule: two enforcement points, two request identifiers, two
\* targets and two parameter values (four actions, one supported by the
\* verifiable inputs); no outage, revocation, trust change or halt.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1, e2}
    ReqIds = {r1, r2}
    Targets = {t1, t2}
    Params = {p1, p2}
    MaxTime = 3
    MaxRequests = 3
    MaxOutages = 0
    MaxRevocations = 0
    MaxTrustChanges = 0
    AllowHalt = FALSE
    Validity = 2
    DecisionDeadline = 1
    HoldDeadline = 1
    PropagationBound = 3
    StalenessBound = 3
    HaltBound = 1
    SyncWithoutNews = FALSE
    Allowed <- MCAllowed
    Variant = "actor_writes_decision"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANTS
    AdmitOnlyAllowed
SYMMETRY MCSymmetry
CHECK_DEADLOCK FALSE
