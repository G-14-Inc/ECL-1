\* broken-hold-never-times-out: variant 'hold_never_times_out' on the liveness
\* model. Liveness under fairness: one enforcement point, one request
\* identifier, two parameter values (one supported), one outage and one halt;
\* no symmetry reduction.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1}
    ReqIds = {r1}
    Targets = {t1}
    Params = {p1, p2}
    MaxTime = 3
    MaxRequests = 2
    MaxOutages = 1
    MaxRevocations = 0
    MaxTrustChanges = 0
    AllowHalt = TRUE
    Validity = 2
    DecisionDeadline = 1
    HoldDeadline = 1
    PropagationBound = 1
    StalenessBound = 1
    HaltBound = 1
    SyncWithoutNews = TRUE
    Allowed <- MCAllowed
    Variant = "hold_never_times_out"
    NoAuthority = NoAuthority
SPECIFICATION Spec
PROPERTIES
    HoldResolves
CHECK_DEADLOCK FALSE
