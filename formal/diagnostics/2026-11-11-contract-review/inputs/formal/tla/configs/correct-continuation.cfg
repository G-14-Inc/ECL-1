\* correct-continuation: focused current-model contract regression.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    r3 = r3
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1}
    ReqIds = {r1, r2, r3}
    Targets = {t1,t2}
    Params = {p1}
    MaxTime = 2
    MaxRequests = 3
    MaxOutages = 0
    MaxRevocations = 1
    MaxTrustChanges = 1
    AllowHalt = FALSE
    Validity = 2
    DecisionDeadline = 2
    HoldDeadline = 2
    PropagationBound = 2
    StalenessBound = 2
    HaltBound = 1
    SyncWithoutNews = FALSE
    Allowed <- MCAllowedAll
    Variant = "correct"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANT Safety
PROPERTIES
    NoEffectDuringReconciliation
    RecoveryBeforeNormal
    NoEffectAtHaltedEP
    NoEffectWithKnownRevocation
    LogAppendOnly
    DecisionsAppendOnly
    NoLateDecision
    NoContinuationWithRevokedApproval
    NoEffectWhileRestricted
    RestrictionLiftRequiresFreshProof
    LiftLogAppendOnly
    NoRecoveredEffectOnUnreconciledState
CHECK_DEADLOCK FALSE
