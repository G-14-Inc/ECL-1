\* correct-liveness: variant 'correct' on the liveness model. Liveness under
\* fairness: one enforcement point, one request identifier, two parameter
\* values (one supported), one outage and one halt; no symmetry reduction.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1}
    ReqIds = {r1}
    Targets = {t1}
    Params = {p1, p2}
    MaxTime = 2
    MaxRequests = 1
    MaxOutages = 0
    MaxRevocations = 0
    MaxTrustChanges = 0
    AllowHalt = FALSE
    Validity = 2
    DecisionDeadline = 1
    HoldDeadline = 1
    PropagationBound = 1
    StalenessBound = 1
    HaltBound = 1
    SyncWithoutNews = TRUE
    Allowed <- MCAllowed
    Variant = "correct"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANTS WitnessNoTimeout
CHECK_DEADLOCK FALSE
