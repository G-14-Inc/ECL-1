\* witness-timeout: variant 'correct' on the control model. Control plane and
\* failures: two enforcement points, one request, the supported action only;
\* one outage of the decision service, one revocation, one trust change and
\* one emergency halt.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1, e2}
    ReqIds = {r1}
    Targets = {t1}
    Params = {p1}
    MaxTime = 4
    MaxRequests = 1
    MaxOutages = 1
    MaxRevocations = 1
    MaxTrustChanges = 1
    AllowHalt = TRUE
    Validity = 4
    DecisionDeadline = 1
    HoldDeadline = 1
    PropagationBound = 1
    StalenessBound = 2
    HaltBound = 1
    SyncWithoutNews = TRUE
    Allowed <- MCAllowed
    Variant = "correct"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANTS
    WitnessNoTimeout
SYMMETRY MCSymmetry
CHECK_DEADLOCK FALSE
