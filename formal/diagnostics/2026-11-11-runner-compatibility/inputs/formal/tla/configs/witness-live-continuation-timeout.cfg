\* witness-live-continuation-timeout: bounded workflow/recovery contract check.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    r3 = r3
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1}
    ReqIds = {r1, r2}
    Targets = {t1}
    Params = {p1}
    MaxTime = 2
    MaxRequests = 2
    MaxOutages = 1
    MaxRevocations = 0
    MaxTrustChanges = 0
    AllowHalt = TRUE
    Validity = 2
    DecisionDeadline = 1
    HoldDeadline = 1
    PropagationBound = 1
    StalenessBound = 1
    HaltBound = 1
    SyncWithoutNews = TRUE
    Allowed <- MCAllowed
    Variant = "correct"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANT WitnessNoContinuationTimeout
CHECK_DEADLOCK FALSE
