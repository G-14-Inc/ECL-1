\* correct-repeated-staleness: bounded workflow/recovery contract check.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    r3 = r3
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1}
    ReqIds = {r1}
    Targets = {t1}
    Params = {p1}
    MaxTime = 4
    MaxRequests = 1
    MaxOutages = 1
    MaxRevocations = 0
    MaxTrustChanges = 0
    AllowHalt = FALSE
    Validity = 5
    DecisionDeadline = 1
    HoldDeadline = 1
    PropagationBound = 2
    StalenessBound = 1
    HaltBound = 1
    SyncWithoutNews = TRUE
    Allowed <- MCAllowed
    Variant = "correct"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANTS
    TypeOK
    EffectHasMatchingAdmit
    EffectWithinAuthority
    SingleUse
    NoEffectBeyondHaltBound
    RevocationBound
    EffectHasEvidence
    OneWayRule
    AdmitOnlyAllowed
    NoEffectDuringOutage
    SafeStateHasNoEffect
    DeadlineBound
    UniqueDecisionResponse
    ContinuationAdmitBound
    OneAdmittingContinuation
    ControlStateFreshAtEffect
    UniqueWorkflowAttempt
PROPERTIES
    FreshStalenessInvalidatesProof
    NoContinuationWithRevokedApproval
    NoEffectWhileRestricted
    RestrictionLiftRequiresFreshProof
    LiftLogAppendOnly
    NoRecoveredEffectOnUnreconciledState
    NoEffectDuringReconciliation
    RecoveryBeforeNormal
    NoEffectAtHaltedEP
    NoEffectWithKnownRevocation
    LogAppendOnly
    DecisionsAppendOnly
    NoLateDecision
CHECK_DEADLOCK FALSE
