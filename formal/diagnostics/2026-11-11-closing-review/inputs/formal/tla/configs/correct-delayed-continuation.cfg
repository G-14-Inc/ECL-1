\* correct-delayed-continuation: focused current-model contract regression.
CONSTANTS
    e1 = e1
    e2 = e2
    r1 = r1
    r2 = r2
    r3 = r3
    t1 = t1
    t2 = t2
    p1 = p1
    p2 = p2
    EPs = {e1}
    ReqIds = {r1,r2}
    Targets = {t1}
    Params = {p1}
    MaxTime = 3
    MaxRequests = 2
    MaxOutages = 0
    MaxRevocations = 0
    MaxTrustChanges = 0
    AllowHalt = FALSE
    Validity = 3
    DecisionDeadline = 2
    HoldDeadline = 2
    PropagationBound = 3
    StalenessBound = 3
    HaltBound = 1
    SyncWithoutNews = FALSE
    Allowed <- MCAllowed
    Variant = "correct"
    NoAuthority = NoAuthority
SPECIFICATION Spec
INVARIANT Safety
PROPERTIES
    FreshStalenessInvalidatesProof
    NoEffectDuringReconciliation
    RecoveryBeforeNormal
    NoEffectAtHaltedEP
    NoEffectWithKnownRevocation
    LogAppendOnly
    DecisionsAppendOnly
    NoLateDecision
    NoContinuationWithRevokedApproval
    NoEffectWhileRestricted
    RestrictionLiftRequiresFreshProof
    LiftLogAppendOnly
    NoRecoveredEffectOnUnreconciledState
CHECK_DEADLOCK FALSE
