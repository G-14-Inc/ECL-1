[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"
# The build step that bundles the data (ecl_verify_build.py) is imported from this folder.
backend-path = ["."]

[project]
name = "ecl-verify"
version = "1.0.0"
description = "The ECL-1 offline verifier in Python: evidence bundles, offline packages, envelopes, trust policies and the conformance checks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Robert F. Tilley Jr.", email = "ecl@g14.ai" },
]
maintainers = [
  { name = "G-14, Inc.", email = "ecl@g14.ai" },
]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.2",
  "jsonschema>=4.25",
  "referencing>=0.36",
]

[project.urls]
Homepage = "https://externalcontrollayer.ai/ecl-1"
Documentation = "https://externalcontrollayer.ai/ecl-1"

[project.scripts]
ecl-verify = "ecl_verify.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecl_verify = ["py.typed"]

# The wheel bundles the ECL-1 schemas and registries that the verifier reads (ecl_verify_build.py).
[tool.setuptools.cmdclass]
build_py = "ecl_verify_build.BuildPy"

[tool.uv]
required-version = ">=0.12.19"
constraint-dependencies = [
  "attrs==26.1.0",
  "cffi==2.1.0",
  "cryptography==50.0.2",
  "jsonschema==4.25.1",
  "jsonschema-specifications==2025.9.1",
  "pycparser==3.0",
  "referencing==0.36.2",
  "rpds-py==0.30.0",
  "setuptools==83.0.0",
  "typing-extensions==4.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "slow: takes noticeably longer than the rest of the suite; deselect with -m 'not slow'",
]
