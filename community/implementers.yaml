# ECL-1 implementers registry
#
# Self-declared conformance claims, each with a link to its conformance
# report. A listing means that the editors found the submission complete; it
# certifies nothing. How to be listed: governance/CONFORMANCE_CLAIMS.md.
# Schema: community/implementers.schema.json. Each entry has the fields name,
# organization, url, claim, level, status (always "self-declared"), listed and
# report, and may have assessment. Write every value in double quotes.
schema_version: "ecl_implementers_registry_v1"
implementers: []
